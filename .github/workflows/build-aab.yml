name: Build AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      # Builds an unsigned bundle; it is signed with the release key offline before upload to Play.
      - name: Build release bundle
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: StickRang-release-aab
          path: app/build/outputs/bundle/release/*.aab
