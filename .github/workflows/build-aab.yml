name: Build AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Builds an unsigned bundle; it is signed with the release key offline before upload to Play.
      - name: Build release bundle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon bundleRelease assembleRelease 2>&1 | tee build.log
      # Test APK: release build signed with a throwaway key so it can be sideloaded.
      # Play uploads use the AAB, which is signed with the real release key offline.
      - name: Sign test APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore test.jks -storepass android -keypass android -alias test \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=StickRang Test"
          $BT/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks test.jks --ks-pass pass:android --out StickRang-test.apk aligned.apk
          $BT/apksigner verify StickRang-test.apk
      # Surface compiler errors as annotations so they can be read without the raw log.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR|FAILURE|What went wrong" -A3 build.log | head -150 > errs.txt || true
          [ -s errs.txt ] || tail -80 build.log > errs.txt
          split -l 30 errs.txt chunk_
          for f in chunk_*; do echo "::error::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")"; done
      - uses: actions/upload-artifact@v4
        with:
          name: StickRang-release-aab
          path: app/build/outputs/bundle/release/*.aab
      # Also publish the bundle to the build-output branch so it can be fetched with plain git.
      - name: Push bundle to build-output branch
        run: |
          mkdir out && cp app/build/outputs/bundle/release/*.aab StickRang-test.apk out/
          cd out
          git init -q -b build-output
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Bundle from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" build-output
